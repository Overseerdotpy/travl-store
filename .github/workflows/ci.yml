name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Real Chrome is preinstalled on GitHub's Ubuntu runners; the hero clip is H.264, which
      # Playwright's bundled Chromium cannot decode.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  python:
    name: Python tests (wordmark pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      # The generator reads Montserrat Bold from npm (SIL Open Font License), installed on its own so the
      # project's browser tooling isn't pulled in.
      - run: npm i --prefix "$RUNNER_TEMP/font" @fontsource/montserrat
      - run: pytest
        env:
          WORDMARK_FONT: ${{ runner.temp }}/font/node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2

  lighthouse:
    name: Lighthouse (informational)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: CHROME_PATH="$(which google-chrome)" node scripts/lighthouse.mjs | tee lighthouse-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: |
            lighthouse-summary.txt
            .lighthouse/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
